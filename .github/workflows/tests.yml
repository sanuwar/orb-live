name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character commit SHA to verify"
        required: true
        type: string
      reason:
        description: "Informational verification reason"
        required: false
        type: string

concurrency:
  # Grouped by PR number, not by branch/ref: this workflow's own exact-SHA
  # dispatch path (below) deliberately never spells out the two-word
  # "github dot ref" context expression anywhere in this file (see
  # tests/test_exact_sha_workflow.py), so a PR-number-based group --
  # falling back to the run's own unique `github.run_id` for push-to-main
  # and workflow_dispatch runs, which therefore never collide with
  # anything and always run to completion -- gets the same effect without
  # touching that invariant.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  # A newer push to the same PR makes an in-flight run's result moot --
  # only the latest commit's outcome ever gates a merge, so the superseded
  # run is cancelled rather than left to burn minutes to completion.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out event revision
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate requested exact SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be exactly 40 hexadecimal characters" >&2
            exit 1
          fi

      - name: Check out requested exact SHA
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Assert requested exact SHA is checked out
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          requested_sha_lower="${REQUESTED_SHA,,}"
          git fetch --no-tags --depth=1 origin "$requested_sha_lower"
          git checkout --detach "$requested_sha_lower"
          actual_sha="$(git rev-parse HEAD)"
          echo "requested_sha=$requested_sha_lower"
          echo "checked_out_sha=$actual_sha"
          test "$actual_sha" = "$requested_sha_lower"

      - name: Print checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Run tracked operator verification
        run: |
          python -m pytest -q tests/test_architecture_audit.py
          python scripts/verify_operator_routes.py
          python scripts/verify_operator_milestone.py

      - name: Check whitespace
        run: git diff --check
