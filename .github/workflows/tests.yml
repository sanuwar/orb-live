name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly full-suite verification of main. Cost-conscious cadence: one
    # scheduled run per week, not nightly. Scheduled runs are always
    # classified as the full tier regardless of any path heuristic.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character commit SHA to verify"
        required: true
        type: string
      reason:
        description: "Informational verification reason"
        required: false
        type: string
      full_suite:
        description: "Run the complete suite regardless of detected tier"
        required: false
        default: true
        type: boolean

concurrency:
  # Grouped by PR number, not by branch/ref: this workflow's own exact-SHA
  # dispatch path (below) deliberately never spells out the two-word
  # "github dot ref" context expression anywhere in this file (see
  # tests/test_exact_sha_workflow.py), so a PR-number-based group --
  # falling back to the run's own unique `github.run_id` for push-to-main
  # and workflow_dispatch runs, which therefore never collide with
  # anything and always run to completion -- gets the same effect without
  # touching that invariant.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  # A newer push to the same PR makes an in-flight run's result moot --
  # only the latest commit's outcome ever gates a merge, so the superseded
  # run is cancelled rather than left to burn minutes to completion.
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out event revision
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate requested exact SHA
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be exactly 40 hexadecimal characters" >&2
            exit 1
          fi

      - name: Check out requested exact SHA
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Assert requested exact SHA is checked out
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          requested_sha_lower="${REQUESTED_SHA,,}"
          git fetch --no-tags --depth=1 origin "$requested_sha_lower"
          git checkout --detach "$requested_sha_lower"
          actual_sha="$(git rev-parse HEAD)"
          echo "requested_sha=$requested_sha_lower"
          echo "checked_out_sha=$actual_sha"
          test "$actual_sha" = "$requested_sha_lower"

      - name: Print checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Determines the cheapest safe verification tier for this run.
      # Every failure mode in this step -- an API error, an unreadable
      # file list, an unexpected event type, a crashing classifier --
      # resolves to the full tier. There is no path here that can make
      # the run lighter by failing.
      - name: Classify change tier
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_suite }}
        run: |
          set -uo pipefail

          emit_full() {
            echo "tier=TIER_3_FULL" >> "$GITHUB_OUTPUT"
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            {
              echo "### CI tier: \`TIER_3_FULL\` (full suite)"
              echo ""
              echo "Reason: $1"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            emit_full "event '$EVENT_NAME' is not a pull request; full verification is mandatory"
          fi

          if [[ "$FORCE_FULL" == "true" ]]; then
            emit_full "full-suite override requested"
          fi

          if [[ -z "${PR_NUMBER:-}" ]]; then
            emit_full "pull request number unavailable; cannot determine changed files"
          fi

          if ! gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
                 --jq '.[].filename' > changed_files.txt 2>api_error.txt; then
            emit_full "could not list changed files: $(head -c 300 api_error.txt)"
          fi

          if [[ ! -s changed_files.txt ]]; then
            emit_full "changed-file list was empty; refusing to skip verification"
          fi

          if ! classification="$(python -m scripts.ci.classify_changes \
                                   --format json < changed_files.txt)"; then
            emit_full "classifier exited non-zero"
          fi

          tier="$(printf '%s' "$classification" | python -c \
            'import json,sys; print(json.load(sys.stdin)["tier"])' 2>/dev/null)" || \
            emit_full "could not parse classifier output"

          case "$tier" in
            TIER_1_PUBLICATION_DOCS|TIER_2_PUBLICATION_TOOLING|TIER_3_FULL) ;;
            *) emit_full "unrecognized tier '${tier}' from classifier" ;;
          esac

          run_full=false
          if [[ "$tier" == "TIER_3_FULL" ]]; then
            run_full=true
          fi

          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"

          {
            echo "### CI tier: \`${tier}\`"
            echo ""
            echo "Reasons:"
            printf '%s' "$classification" | python -c \
              'import json,sys; [print("- " + r) for r in json.load(sys.stdin)["reasons"]]'
            echo ""
            echo "<details><summary>Changed files ($(wc -l < changed_files.txt))</summary>"
            echo ""
            sed 's/^/- `/; s/$/`/' changed_files.txt
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Tier 3: full verification (default and fallback) ---------------

      - name: Run tests
        if: steps.classify.outputs.run_full != 'false'
        run: python -m pytest -v

      - name: Run tracked operator verification
        if: steps.classify.outputs.run_full != 'false'
        run: |
          python -m pytest -q tests/test_architecture_audit.py
          python scripts/verify_operator_routes.py
          python scripts/verify_operator_milestone.py

      # --- Tier 2: publication tooling ------------------------------------

      - name: Run publication-focused tests
        if: steps.classify.outputs.tier == 'TIER_2_PUBLICATION_TOOLING'
        run: python -m pytest -v tests/test_publication_p2_artifacts.py

      - name: Verify deterministic publication-table regeneration
        if: steps.classify.outputs.tier == 'TIER_2_PUBLICATION_TOOLING'
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.publication.generate_p2_hypothesis_ledger
          python -m scripts.publication.generate_p2_hypothesis_ledger
          git diff --exit-code -- docs/publication/p2/HYPOTHESIS_LEDGER_M43_M55.md

      - name: Run architecture bookkeeping checks
        if: steps.classify.outputs.tier == 'TIER_2_PUBLICATION_TOOLING'
        run: python -m pytest -q tests/test_architecture_audit.py

      # --- Tier 1 and Tier 2: safety state and protected-file non-overlap --

      - name: Verify strategy remains disabled
        if: steps.classify.outputs.run_full == 'false'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          import yaml
          with open("config/strategy_v0.yaml", encoding="utf-8") as handle:
              config = yaml.safe_load(handle)
          enabled = config.get("strategy", {}).get("enabled")
          print(f"strategy.enabled={enabled!r}")
          if enabled is not False:
              print("strategy.enabled must be exactly false", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Verify protected and M55 files are untouched
        if: steps.classify.outputs.run_full == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[].filename' > verify_files.txt
          echo "Changed files:"
          sed 's/^/  /' verify_files.txt
          if grep -Eq '^(src/|config/|data/|docs/research/|\.github/)' verify_files.txt; then
            echo "A protected path changed but the tier was not full; failing closed." >&2
            exit 1
          fi
          if grep -q 'MOMENTUM_PROSPECTIVE_MONITOR_M55' verify_files.txt; then
            echo "An M55 protocol/checkpoint file changed; full verification required." >&2
            exit 1
          fi
          echo "No protected or M55 path in this change set."

      # --- All tiers -------------------------------------------------------

      - name: Check whitespace
        run: git diff --check
