[pytest]
# checkpoint_7c_adapter_initialization_launcher.py and its test module are
# untracked, archived acceptance artifacts for the superseded
# initialization-only launcher. That test module pins
# PINNED_IMPLEMENTATION_COMMIT = 1b378605 (the PR #18 merge, 56 commits behind
# current main) and hashes of source files that have legitimately changed
# since, so it fails by design against any newer tree.
#
# CI never sees it -- it is untracked -- so ignoring it here makes a local run
# collect exactly what CI collects, and stops a stale pin from distorting the
# authoritative suite count. It is deliberately NOT deleted or re-pinned:
# re-pinning would destroy the very property it asserts, and the successor
# launcher is covered by tracked tests. See
# CHECKPOINT_7C_FINAL_EVIDENCE_PERSISTENCE_HOUSEKEEPING.md.
addopts = --ignore=test_checkpoint_7c_adapter_initialization_launcher.py
